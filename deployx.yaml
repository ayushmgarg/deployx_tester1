# Paste this into DeployX → project → Pipelines → New pipeline.
name: tester-pipeline
tasks:
  test:
    steps:
      - name: Unit tests
        command: node test.js
        image: node:20-alpine       # runs in a container: no Node needed on the runner

  deploy:
    depends_on: [test]
    steps:
      - name: Ready
        command: echo "deploying ${{ git.short_sha }}"
    deploy:
      driver: docker_local          # or: auto (cloud broker)
      strategy: blue_green          # or: canary | rolling
      port: 3000
      # no image: the runner builds ./Dockerfile
      health_check:
        path: /health
      public_url: true              # Cloudflare link; documents at <link>/files/<path>
      env:
        APP_VERSION: "1.0.0"        # bump and re-run to see the blue-green switch
      resources:
        cpus: 0.5
        memory_mb: 256
      rate_limit:                   # more than 10 req/s per visitor gets 429
        requests_per_second: 10
        burst: 20
      # security_scan:              # uncomment to scan with Trivy (~200 MB download)
      #   severity: [HIGH, CRITICAL]
      #   fail_on_findings: false
