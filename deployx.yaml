name: deployx-tester-pipeline
tasks:
  test:
    steps:
      - name: Install dependencies
        command: npm ci
      - name: Run tests
        command: npm test

  build:
    depends_on: [test]
    steps:
      - name: Build Docker image
        command: docker build -t deployx-tester:${{ git.short_sha }} .
    deploy:
      driver: docker_local
      strategy: blue_green
      port: 3000
      image: deployx-tester:${{ git.short_sha }}
      health_check:
        path: /health
        interval_seconds: 10
        timeout_seconds: 5
        retries: 3
        start_period_seconds: 15
      public_url: true            # Cloudflare link; documents at <link>/files/<path>
      env:
        APP_VERSION: "1.0.0"      # bump and re-run to see the blue-green switch
      resources:
        cpus: 0.5
        memory_mb: 256
      rate_limit:                 # more than 10 req/s per visitor gets 429
        requests_per_second: 10
        burst: 20
